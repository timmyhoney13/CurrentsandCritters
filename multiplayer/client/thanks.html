<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You, Currents and Critters</title>
<!--
  WHERE STRIPE LANDS THE BUYER AFTER A SUCCESSFUL PAYMENT.

  Set this on EVERY Payment Link (Stripe Dashboard → Payment Links → edit link →
  "After payment" → "Redirect customers to your website"):

      https://play.currentsandcritters.com/thanks?session_id={CHECKOUT_SESSION_ID}

  Type the {CHECKOUT_SESSION_ID} placeholder literally: Stripe substitutes the
  real session id. Without it the page still works and still shows the Back to
  the game button; it just can't confirm the purchase landed, so it says
  "rewards arrive automatically" instead of naming what was bought.

  The page NEVER credits anything itself. It only ASKS the server whether the
  webhook already fulfilled the payment (/api/stripe/session-status). All money
  and all rewards are decided server-side in the Stripe webhook.
-->
<style>
  :root{ --deep:#04263b; --teal:#0fb6c4; --gold:#ffd479; --ink:#eaf6fb; --muted:#9fc6d6; }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#0a4d6b 0%,#063a54 45%,#04263b 100%) fixed;
  }
  .wrap{max-width:560px;width:100%;margin:0 auto;padding:36px 20px 48px;text-align:center}
  .mark{font-size:56px;line-height:1;margin-bottom:6px}
  h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:.15em 0 .3em}
  .sub{color:var(--muted);line-height:1.55;margin:0 auto 24px;max-width:460px}
  .card{
    background:rgba(3,30,46,.55);border:1px solid rgba(79,193,213,.28);border-radius:16px;
    padding:18px 20px;margin:0 0 22px;text-align:left;
  }
  .card h2{margin:0 0 .35em;font-size:1rem;color:var(--gold)}
  .card p{color:var(--muted);line-height:1.5;margin:.25em 0;font-size:.92rem}
  .status{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:600}
  .status .dot{
    width:10px;height:10px;border-radius:50%;background:var(--muted);flex:0 0 auto;
  }
  .status.is-ok   .dot{background:#7ef0ab;box-shadow:0 0 10px rgba(126,240,171,.8)}
  .status.is-wait .dot{background:var(--gold);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .status.is-wait .dot{animation:none;opacity:.8} }
  .btn{
    display:inline-block;font:inherit;font-weight:700;border:0;border-radius:12px;
    padding:15px 26px;cursor:pointer;text-decoration:none;
    background:linear-gradient(180deg,#15c1cf,#0a96a3);color:#022331;
    transition:filter .15s, transform .15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-lg{font-size:1.05rem;width:100%;max-width:320px}
  .links{margin-top:20px;font-size:.9rem;line-height:2}
  .links a{color:var(--teal);text-decoration:none;margin:0 10px}
  .links a:hover{text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">🐚</div>
    <h1>Thank you!</h1>
    <p class="sub" id="lead">Your payment went through. Thanks for backing Currents and Critters, it genuinely helps.</p>

    <div class="card">
      <h2>Your purchase</h2>
      <div class="status is-wait" id="status"><span class="dot"></span><span id="status-text">Confirming your payment…</span></div>
      <p id="status-note">This usually takes just a few seconds.</p>
    </div>

    <!-- The button the whole page exists for. Its href is set by the script to
         the exact page the player left (see cc_stripe_return), so someone who
         bought from inside the dedicated game window goes back INTO that window
         rather than re-launching a second one. Falls back to "/". -->
    <a class="btn btn-lg" id="backBtn" href="/">← Back to the game</a>

    <div class="links">
      <a href="/supporter-wall">View the Supporter Reef Wall</a>
      <a href="/claim-rewards" id="claimLink">Link a payment to my account</a>
    </div>
  </div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }

  // ── The "Back to the game" target ──────────────────────────────────
  // preview-app.js stores where the player was standing right before it sent
  // them to Stripe. Returning to a bare "/" would be wrong for the dedicated
  // game window: "/" is the LAUNCHER, so it would try to open a SECOND window.
  // The stored value is same-origin-only and short-lived, and we re-validate it
  // here rather than trusting it, so a stale or tampered entry can only ever
  // send the player to a path on this site.
  var RETURN_KEY = "cc_stripe_return";
  var RETURN_MAX_AGE_MS = 6 * 60 * 60 * 1000;   // 6h, far longer than a checkout

  function safeReturnUrl(){
    try {
      var raw = localStorage.getItem(RETURN_KEY);
      if(!raw) return null;
      var saved = JSON.parse(raw);
      if(!saved || typeof saved.url !== "string") return null;
      if(!saved.at || (Date.now() - Number(saved.at)) > RETURN_MAX_AGE_MS) return null;
      // Must be a same-site PATH. Reject anything with a scheme or a host
      // ("//evil.com", "https://…", "javascript:…") so this can never become an
      // open redirect.
      var u = saved.url;
      if(u.charAt(0) !== "/" || u.charAt(1) === "/") return null;
      return u;
    } catch(_){ return null; }
  }

  var back = safeReturnUrl();
  if(back) $("backBtn").href = back;
  // One-shot: clear it so a later visit to this page doesn't reuse a stale spot.
  try { localStorage.removeItem(RETURN_KEY); } catch(_){}

  // ── Confirm the payment actually landed ────────────────────────────
  // Stripe hands us the session id; the server tells us whether its webhook has
  // already recorded and fulfilled that session. We only claim a purchase is
  // confirmed when the SERVER says so, so a misconfigured webhook signing
  // secret shows up here as "still processing" instead of a page that lies.
  var sessionId = new URLSearchParams(location.search).get("session_id") || "";

  function setStatus(cls, text, note){
    var el = $("status");
    el.className = "status " + cls;
    $("status-text").textContent = text;
    $("status-note").textContent = note || "";
  }

  function describe(d){
    if(d.kind === "coins" && d.value){
      return Number(d.value).toLocaleString("en-US") + " Critter Coins added to your account";
    }
    if(d.kind === "tier" && d.value){
      var pretty = String(d.value).split("-").map(function(w){
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(" ");
      // tierCoins comes from the server's grants table, so this page never
      // holds its own (drifting) copy of the coin amounts.
      var tc = Number(d.tierCoins) || 0;
      if(tc > 0){
        return pretty + " unlocked, welcome aboard - "
             + tc.toLocaleString("en-US") + " Critter Coins added to your account";
      }
      return pretty + " unlocked, welcome aboard";
    }
    return "Payment confirmed";
  }

  if(!sessionId){
    // No session id (the Payment Link redirect has no {CHECKOUT_SESSION_ID}, or
    // someone opened /thanks directly). Say something true and useful instead of
    // inventing a confirmation.
    setStatus("", "Payment received",
      "Your rewards are credited automatically once Stripe confirms the payment, usually within a minute.");
    return;
  }

  // Poll briefly: the webhook normally lands before the buyer's browser even
  // gets here, but a cold Render instance can take a few seconds to wake.
  var attempts = 0;
  var MAX_ATTEMPTS = 12;          // ~40s total
  function poll(){
    attempts++;
    fetch("/api/stripe/session-status?session_id=" + encodeURIComponent(sessionId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok && d.processed){
          setStatus("is-ok", describe(d),
            d.matched
              ? "It's already on your account, no action needed."
              // Not matched to an account. The code we just emailed is now the
              // way in, and it is the ONLY way in for a player who signs in
              // with a username rather than an email, so lead with it. The
              // claim link below still works and stays as the fallback.
              : "Check your email: we've sent you a code. Sign in to the game, "
                + "open the Friends tab and paste it into Redeem a Code.");
          if(!d.matched) $("claimLink").style.fontWeight = "700";
          return;
        }
        if(attempts >= MAX_ATTEMPTS){
          setStatus("", "Payment received, still finalising",
            "Stripe has your payment. Rewards land automatically, usually within a minute. If it hasn't shown up in a few minutes, use the link below.");
          return;
        }
        setTimeout(poll, attempts < 4 ? 1500 : 4000);
      })
      .catch(function(){
        if(attempts >= MAX_ATTEMPTS){
          setStatus("", "Payment received",
            "We couldn't reach the server to confirm, but your payment is safe with Stripe and rewards are credited automatically.");
          return;
        }
        setTimeout(poll, 4000);
      });
  }
  poll();
})();
</script>
</body>
</html>
