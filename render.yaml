services:
  - type: web
    name: fish-game-multiplayer
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: fish-room-state
      mountPath: /var/data/fish-room-state
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FISH_ROOM_STATE_DIR
        value: /var/data/fish-room-state
      - key: FISH_GAMES_HISTORY_DIR
        value: /var/data/fish-room-state/games_history
      - key: FISH_COMPETITIVE_GAMES_DIR
        value: /var/data/fish-room-state/competitive_games
      - key: FISH_STATS_PATH
        value: /var/data/fish-room-state/site_stats.json
      - key: FISH_STATS_SEED_GAMES
        value: "80"
      - key: FISH_STATS_SEED_PLAYERS
        value: "10"
      - key: FISH_CREATE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Service account JSON (the whole file contents, pasted as one value) so
      # the server can read exact registered + live online player counts from
      # Firestore for /api/stats. Generate at: Firebase console → Project
      # settings → Service accounts → Generate new private key.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Stripe checkout webhook (POST /api/stripe/webhook): credits Critter
      # Coins / grants Supporter Tiers after a successful payment.
      #   STRIPE_WEBHOOK_SECRET: the endpoint's "Signing secret" (whsec_…) from
      #     Stripe Dashboard → Developers → Webhooks → your endpoint. REQUIRED,
      #     the webhook rejects every event until this is set. Use the TEST
      #     secret while the Store uses TEST Payment Links; the LIVE secret at
      #     launch. TEST and LIVE mode have SEPARATE endpoints and SEPARATE
      #     signing secrets: switching the Store to live Payment Links without
      #     also switching this value means every real payment is collected and
      #     none of them are ever fulfilled.
      #     Subscribe the endpoint to BOTH:
      #       checkout.session.completed
      #       checkout.session.async_payment_succeeded
      #   STRIPE_SECRET_KEY: secret API key (sk_test_… / sk_live_…). Optional:
      #     fulfilment works without it; reserved for future use.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # ── Discord join reward (discord_server.py) ─────────────────────────
      # 250 Critter Coins, once, for actually being in the Discord server.
      # Step-by-step setup is in DISCORD_REWARD_SETUP.md. Until all three of
      # the sync:false values below are set, the server logs "join reward OFF",
      # the game hides the offer entirely, and every claim is refused, it never
      # falls back to paying out unchecked.
      #
      #   DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET
      #                    From Discord Developer Portal → your app → OAuth2.
      #   DISCORD_GUILD_ID The server players must be in. Enable Developer Mode
      #                    in Discord, then right-click the server → Copy Server ID.
      #   DISCORD_REDIRECT_URI
      #                    Must EXACTLY match a redirect added on the OAuth2
      #                    page, character for character, or Discord rejects
      #                    every claim with an "invalid_grant" 400.
      #   DISCORD_REWARD_COINS / DISCORD_INVITE_URL
      #                    Optional overrides for the amount and the invite the
      #                    game advertises (defaults: 250, the community invite).
      - key: DISCORD_REDIRECT_URI
        value: https://play.currentsandcritters.com/api/discord/callback
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_REWARD_COINS
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      # ── Newsletter (newsletter_server.py / newsletter_email.py) ─────────
      # Full setup, including DNS, is in NEWSLETTER_SETUP.md. Values marked
      # sync:false are secrets: enter them in the Render dashboard, never here.
      #
      # ONLY TWO THINGS ARE ACTUALLY REQUIRED:
      #   1. NEWSLETTER_UNSUBSCRIBE_SECRET
      #   2. ONE way to send mail, the SMTP_* block below is the easy one.
      #
      #   NEWSLETTER_UNSUBSCRIBE_SECRET
      #                    Random 32+ byte string that signs unsubscribe links.
      #                    REQUIRED: campaign sending refuses to start without
      #                    it, because marketing mail with no working
      #                    unsubscribe link is what gets a domain blocked.
      #                    ⚠️ Changing it invalidates every unsubscribe link
      #                    already sitting in someone's inbox.
      #                    Generate: python3 -c "import secrets;print(secrets.token_urlsafe(48))"
      #
      #   SMTP_HOST / SMTP_PORT / SMTP_USERNAME / SMTP_PASSWORD
      #                    THE DEFAULT AND EASIEST WAY TO SEND. Four values from
      #                    whoever already hosts your domain email. Port 587 with
      #                    STARTTLS is the norm; 465 switches to implicit TLS
      #                    automatically. If your mail is on Google Workspace,
      #                    use smtp.gmail.com with an APP PASSWORD, that needs
      #                    no Google Cloud project, no OAuth consent screen and
      #                    no refresh token.
      #
      #   NEWSLETTER_API_KEY (+ optional NEWSLETTER_HTTP_PROVIDER)
      #                    ALTERNATIVE: an HTTPS email API instead of SMTP:
      #                    resend | postmark | brevo | sendgrid (default resend).
      #                    Use this if outbound SMTP is blocked. One key, no SMTP.
      #
      #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REFRESH_TOKEN
      #                    OPTIONAL third route (Gmail API over OAuth). Only this
      #                    one needs a Google Cloud project, which is exactly why
      #                    it is last and why nothing requires it. Leave unset.
      #
      #   NEWSLETTER_TRANSPORT
      #                    Optional override: smtp | http | gmail_api. Unset, the
      #                    first fully-configured one in that order wins.
      #
      #   NEWSLETTER_FIELD_LABEL
      #                    Optional. The EXACT label of the optional newsletter
      #                    question on your Stripe Payment Links, if it is not
      #                    one of the spellings already accepted in
      #                    newsletter_server.NEWSLETTER_FIELD_LABELS. Separate
      #                    several with "|". A label is a behaviour key: if it
      #                    does not match, nobody is ever subscribed and there
      #                    is no error anywhere. The admin Connections tab
      #                    shows the labels Stripe actually sent.
      # Everyone allowed into /admin/newsletter, comma-separated. Exact-match
      # allowlist, never a domain or a pattern. The FIRST is the primary and
      # receives the "new subscriber" notifications and test emails.
      - key: ADMIN_EMAIL
        value: timothy.honey@beardedsealstudios.com,currentsandcritters@gmail.com
      # ⚠️ This is a CONSUMER @gmail.com address, not an address on
      # beardedsealstudios.com, and that has three consequences worth knowing
      # before wondering why mail is filtered:
      #   1. the real sending ceiling is ~500 recipients per rolling 24h, not
      #      the ~2,000 a Workspace domain gets (see the cap below);
      #   2. SPF/DKIM/DMARC are Google's own and always pass, so the admin
      #      Domain-authentication panel has nothing to fix here, and the DMARC
      #      record on beardedsealstudios.com is irrelevant while this is the
      #      From address;
      #   3. bulk mail from a consumer address is filtered harder than mail
      #      from a domain you own. Moving to timothy.honey@beardedsealstudios.com
      #      (which already has SPF and DKIM published) is the single biggest
      #      deliverability upgrade available, and only needs the DMARC record.
      - key: NEWSLETTER_FROM_EMAIL
        value: currentsandcritters@gmail.com
      - key: NEWSLETTER_FROM_NAME
        value: Currents & Critters
      - key: APP_BASE_URL
        value: https://play.currentsandcritters.com
      - key: CURRENTS_AND_CRITTERS_URL
        value: https://currentsandcritters.com
      - key: PRIVACY_POLICY_URL
        value: https://currentsandcritters.com/privacy
      # NEWSLETTER_DAILY_SEND_CAP is deliberately NOT set here.
      #
      # It used to be pinned to "1200", which is the Workspace-sized budget and
      # roughly two and a half times what the consumer @gmail.com From address
      # above is actually allowed. Going over does not bounce: Google throttles
      # or SUSPENDS the account, sometimes for a full 24 hours, and while it is
      # suspended NOTHING sends, including the welcome email of every person
      # who signs up in the meantime.
      #
      # daily_send_cap() already derives the right number from the From address
      # (400 for a consumer account, 1200 for a domain), specifically so that
      # changing the From address cannot leave a too-large cap pointed at a
      # too-small mailbox. Hard-coding a value here overrode that safety with
      # the exact mistake it was written to prevent. Leave it unset and let the
      # code follow the sender; set it only to LOWER the number.
      - key: SMTP_PORT
        value: "587"
      - key: NEWSLETTER_UNSUBSCRIBE_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NEWSLETTER_API_KEY
        sync: false
      - key: NEWSLETTER_HTTP_PROVIDER
        sync: false
      - key: NEWSLETTER_TRANSPORT
        sync: false
      - key: NEWSLETTER_FIELD_LABEL
        sync: false
      # Snap & Score (score.currentsandcritters.com: add it as a second custom
      # domain on this same service). Board-photo card recognition runs locally
      # in the player's browser against the prebuilt snap-card-library.json,
      # no API key and no per-photo cost. Regenerate the library with
      # `python3 build_snap_card_library.py` whenever the card art changes.
