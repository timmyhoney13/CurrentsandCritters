services:
  - type: web
    name: fish-game-multiplayer
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: fish-room-state
      mountPath: /var/data/fish-room-state
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FISH_ROOM_STATE_DIR
        value: /var/data/fish-room-state
      - key: FISH_GAMES_HISTORY_DIR
        value: /var/data/fish-room-state/games_history
      - key: FISH_COMPETITIVE_GAMES_DIR
        value: /var/data/fish-room-state/competitive_games
      - key: FISH_STATS_PATH
        value: /var/data/fish-room-state/site_stats.json
      - key: FISH_STATS_SEED_GAMES
        value: "80"
      - key: FISH_STATS_SEED_PLAYERS
        value: "10"
      - key: FISH_CREATE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Service account JSON (the whole file contents, pasted as one value) so
      # the server can read exact registered + live online player counts from
      # Firestore for /api/stats. Generate at: Firebase console → Project
      # settings → Service accounts → Generate new private key.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Stripe checkout webhook (POST /api/stripe/webhook) — credits Critter
      # Coins / grants Supporter Tiers after a successful payment.
      #   STRIPE_WEBHOOK_SECRET: the endpoint's "Signing secret" (whsec_…) from
      #     Stripe Dashboard → Developers → Webhooks → your endpoint. REQUIRED —
      #     the webhook rejects every event until this is set. Use the TEST
      #     secret while the Store uses TEST Payment Links; the LIVE secret at
      #     launch. TEST and LIVE mode have SEPARATE endpoints and SEPARATE
      #     signing secrets: switching the Store to live Payment Links without
      #     also switching this value means every real payment is collected and
      #     none of them are ever fulfilled.
      #     Subscribe the endpoint to BOTH:
      #       checkout.session.completed
      #       checkout.session.async_payment_succeeded
      #   STRIPE_SECRET_KEY: secret API key (sk_test_… / sk_live_…). Optional —
      #     fulfilment works without it; reserved for future use.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # ── Newsletter (newsletter_server.py / newsletter_email.py) ─────────
      # Full setup instructions, including every Google Cloud and DNS step,
      # are in NEWSLETTER_SETUP.md. Values marked "secret" must be entered in
      # the Render dashboard, never committed.
      #
      #   ADMIN_EMAIL      The ONLY Google account that can open
      #                    /admin/newsletter. Compared against the verified
      #                    Firebase ID token server-side.
      #   NEWSLETTER_UNSUBSCRIBE_SECRET
      #                    Random 32+ byte string that signs unsubscribe
      #                    links. REQUIRED — campaign sending refuses to start
      #                    without it, because marketing mail with no working
      #                    unsubscribe link is the thing that gets a domain
      #                    blocked. ⚠️ Changing it invalidates every
      #                    unsubscribe link already sitting in an inbox.
      #                    Generate: python3 -c "import secrets;print(secrets.token_urlsafe(48))"
      #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REFRESH_TOKEN
      #                    Gmail API OAuth credentials. Produce the refresh
      #                    token locally with scripts/get_gmail_refresh_token.py
      #                    and paste it here. Scopes requested: gmail.send +
      #                    openid email — send-only, no mailbox read access.
      #   NEWSLETTER_FIELD_LABEL
      #                    Optional. The EXACT label of the optional newsletter
      #                    question on your Stripe Payment Links, if it is not
      #                    one of the spellings already accepted in
      #                    newsletter_server.NEWSLETTER_FIELD_LABELS. Separate
      #                    several with "|". A label is a behaviour key: if it
      #                    does not match, nobody is ever subscribed and there
      #                    is no error anywhere. The admin Connections tab
      #                    shows the labels Stripe actually sent.
      - key: ADMIN_EMAIL
        value: timothy.honey@beardedsealstudios.com
      - key: GMAIL_SENDER_EMAIL
        value: timothy.honey@beardedsealstudios.com
      - key: GMAIL_SENDER_NAME
        value: Currents & Critters
      - key: APP_BASE_URL
        value: https://play.currentsandcritters.com
      - key: CURRENTS_AND_CRITTERS_URL
        value: https://currentsandcritters.com
      - key: PRIVACY_POLICY_URL
        value: https://currentsandcritters.com/privacy
      - key: NEWSLETTER_DAILY_SEND_CAP
        value: "1200"
      - key: NEWSLETTER_UNSUBSCRIBE_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: NEWSLETTER_FIELD_LABEL
        sync: false
      # Snap & Score (score.currentsandcritters.com — add it as a second custom
      # domain on this same service). Board-photo card recognition runs locally
      # in the player's browser against the prebuilt snap-card-library.json —
      # no API key and no per-photo cost. Regenerate the library with
      # `python3 build_snap_card_library.py` whenever the card art changes.
